[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thiruppugazh-api"
version = "0.1.0"
description = "A modern REST API built with Python for the Thiruppugazh project"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0"
]

[tool.setuptools]
packages = ["app"]

[tool.vercel]
entrypoint = "api.main:app"
